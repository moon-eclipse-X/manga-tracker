<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga release tracker</title>
<link
  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="container">
        <h1>Manga Release Tracker</h1>
        <p>Track the latest chapter releases and hiatus updates for your favorite manga.</p>
    </header>

    <main class="container">
        <article>
            <h2>World Trigger</h2>
            <p>Status: <span id="wt-status">Loading...</span></p>
            <p>🇯🇵 Latest Japanese: <span id="wt-jp">Loading...</span></p>
            <p>🇬🇧 Latest English: <span id="wt-en">Loading...</span></p>
            <a href="https://anilist.co" target="_blank">View on AniList</a>
        </article>
    </main>

    <footer class="container">
        <small>Data powered by AniList & MangaDex API.</small>
    </footer>
<script>
    // 1. Unique IDs for World Trigger
    const anilistId = 78151;
    const mangadexId = "329758d5-034e-4d62-8424-75a471f478d2";

    // 2. Helper function to calculate days ago from a date string
    function daysAgo(dateString) {
        const releaseDate = new Date(dateString);
        const today = new Date();
        const difference = today - releaseDate;
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        return days === 0 ? "Today" : days + " days ago";
    }

    // 3. Helper function to calculate days ago from AniList timestamp
    function daysAgoTimestamp(unixTimestamp) {
        const releaseDate = new Date(unixTimestamp * 1000);
        const today = new Date();
        const difference = today - releaseDate;
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        return days === 0 ? "Today" : days + " days ago";
    }

    // 4. Smart function: Try MangaDex first, fallback to AniList!
    async function loadMangaData() {
        // First get AniList data (always works for every manga)
        const anilistUrl = "https://" + "graphql.anilist.co";
        const query = `query { Media(id: ${anilistId}, type: MANGA) { status chapters updatedAt } }`;
        
        const alResponse = await fetch(anilistUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: query })
        });
        const alData = await alResponse.json();
        const manga = alData.data.Media;

        // Show official status immediately
        document.getElementById("wt-status").innerText = manga.status;

        // Now check MangaDex for Japanese and English chapters
        await checkMangaDex("ja", "wt-jp", manga);
        await checkMangaDex("en", "wt-en", manga);
    }

    // 5. Check MangaDex, or use AniList as backup if empty
    async function checkMangaDex(language, elementId, anilistBackup) {
        try {
            const proxy = "https://" + "corsproxy.io/?";
            const api = "https://" + `api.mangadex.org/manga/${mangadexId}/feed?translatedLanguage[]=${language}&order[chapter]=desc&limit=1`;
            
            const response = await fetch(proxy + encodeURIComponent(api));
            const data = await response.json();

            if (data.data && data.data.length > 0) {
                // MangaDex has chapter data! Show exact chapter and date
                const latest = data.data[0].attributes;
                document.getElementById(elementId).innerText = `Chapter ${latest.chapter} (${daysAgo(latest.publishAt)})`;
            } else {
                // MangaDex is empty (like World Trigger) -> Use AniList backup!
                const chText = anilistBackup.chapters ? `Ch. ${anilistBackup.chapters}` : "Official release";
                document.getElementById(elementId).innerText = `${chText} (Updated ${daysAgoTimestamp(anilistBackup.updatedAt)})`;
            }
        } catch (error) {
            // If proxy fails -> Also use AniList backup!
            document.getElementById(elementId).innerText = `Updated ${daysAgoTimestamp(anilistBackup.updatedAt)}`;
        }
    }

    // 6. Start everything!
    loadMangaData();
</script>
</body>
</html>
