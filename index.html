    <header class="container">
        <h1>Manga Release Tracker</h1>
        <p>Track the latest chapter releases and hiatus updates for your favorite manga.</p>
    </header>

    <main class="container">
        <!-- Search bar to filter manga live -->
        <input type="search" id="search-input" placeholder="Search manga by title...">
        <!-- Filter buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="favorites">Favorites</button>
            <button class="filter-btn" data-filter="reading">Reading</button>
            <button class="filter-btn" data-filter="releasing">Releasing</button>
            <button class="filter-btn" data-filter="hiatus">Hiatus Radar</button>
            <button class="filter-btn" data-filter="finished">Finished</button>
        </div>


        <!-- Genre filter dropdown -->
        <select id="genre-filter">
            <option value="all">All Genres</option>
            <option value="action">Action</option>
            <option value="adventure">Adventure</option>
            <option value="comedy">Comedy</option>
            <option value="drama">Drama</option>
            <option value="fantasy">Fantasy</option>
            <option value="mystery">Mystery</option>
            <option value="romance">Romance</option>
            <option value="sci-fi">Sci-Fi</option>
            <option value="sports">Sports</option>
            <option value="supernatural">Supernatural</option>
        </select>

        <!-- Lightweight result counter -->
        <p id="results-count" class="results-count"></p>

        <!-- JavaScript will automatically place all manga cards inside this div -->
        <div id="manga-container"></div>
    </main>

    <footer class="container">
        <small>
            Data powered by AniList & MangaDex API. Note: Licensed series without MangaDex uploads show the latest
            AniList database update instead of an exact chapter date.

        // 2. Helper function to calculate days ago
        function daysAgo(dateString) {
            const days = Math.floor((new Date() - new Date(dateString)) / (1000 * 60 * 60 * 24));
            return days === 0 ? "Today" : days + " days ago";
        }

        // Load saved favorites from the visitor's browser
        let savedFavorites = JSON.parse(localStorage.getItem("mangaFavorites")) || [];

        // Toggle favorite status when clicking the star button
        function toggleFavorite(mangaId, buttonElement) {
            if (savedFavorites.includes(mangaId)) {
                savedFavorites = savedFavorites.filter(id => id !== mangaId);
                buttonElement.classList.remove("is-fav");
                buttonElement.innerText = "☆";
            } else {
                savedFavorites.push(mangaId);
                buttonElement.classList.add("is-fav");
                buttonElement.innerText = "★";
            }
            localStorage.setItem("mangaFavorites", JSON.stringify(savedFavorites));
            filterCards();
        }

        // Helper to format AniList official publication info without parentheses
        function formatOfficialInfo(info) {
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const chText = info.chapters ? `${info.chapters} ch. • ` : "";

            if (info.status === "FINISHED" && info.endDate && info.endDate.year) {
                const m = info.endDate.month ? `${months[info.endDate.month - 1]} ` : "";
                return `${chText}Completed • ${m}${info.endDate.year}`;
            }
            if (info.startDate && info.startDate.year) {
                const m = info.startDate.month ? `${months[info.startDate.month - 1]} ` : "";
                return `${chText}Serializing since ${m}${info.startDate.year}`;
            }
            return `${chText}Official release`;
        }

        // 3. Build HTML cards and fetch ALL AniList data in batches of 50
        // Load saved favorites from the visitor's browser

        // Load personal reading progress from browser storage
        let savedProgress = JSON.parse(localStorage.getItem("mangaProgress")) || {};

        // Update chapter progress (+1 or -1) without needing an account
        function updateProgress(mangaId, change) {
            const current = savedProgress[mangaId] || 0;
            const next = Math.max(0, current + change);
            savedProgress[mangaId] = next;

            localStorage.setItem("mangaProgress", JSON.stringify(savedProgress));
            document.getElementById(`${mangaId}-progress`).value = next;
            filterCards();
        }

        // Save typed chapter number directly
        function setProgress(mangaId, value) {
            const num = Math.max(0, parseInt(value) || 0);
            savedProgress[mangaId] = num;
            localStorage.setItem("mangaProgress", JSON.stringify(savedProgress));
            filterCards();
        }

        // 3. Build HTML cards and fetch ALL AniList data in batches of 50
        async function initTracker() {
            const container = document.getElementById("manga-container");
            if (!container) return;

            // Automatically remove duplicate entries based on anilistId
            const seenIds = new Set();
            const uniqueMangaList = mangaList.filter(manga => {
                if (seenIds.has(manga.anilistId)) return false;
                seenIds.add(manga.anilistId);
                return true;
            });

            // Sort alphabetically (A-Z)
            uniqueMangaList.sort((a, b) => a.title.localeCompare(b.title));

            // Create all cards first
            for (const manga of uniqueMangaList) {
                               const card = document.createElement("article");
                card.className = "manga-card";
                card.setAttribute("data-id", manga.id);
                card.setAttribute("data-title", manga.title.toLowerCase());
                const isFav = savedFavorites.includes(manga.id);
                const starIcon = isFav ? "★" : "☆";
                const favClass = isFav ? "fav-btn is-fav" : "fav-btn";
                const userCh = savedProgress[manga.id] || 0;
                const noteHtml = manga.note ? `<p class="custom-note">${manga.note}</p>` : "";
                const anilistLink = "https://" + "anilist.co/manga/" + manga.anilistId;
                // Fallback to a smart search for official publishers if no specific readUrl is set
                const searchBase = "https://" + "duckduckgo.com" + "/?q=";
                const fallbackSearch = searchBase + encodeURIComponent(manga.title + " read official manga");
                const officialReadLink = manga.readUrl || fallbackSearch;

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h2>${manga.title}</h2>
                            <button class="${favClass}" onclick="toggleFavorite('${manga.id}', this)" title="Save to favorites">${starIcon}</button>
                        </div>
                        <p>Status: <span id="${manga.id}-status">Loading...</span></p>
                        <p>Latest Chapter: <span id="${manga.id}-latest">Loading...</span></p>
                        ${noteHtml}
                                               <div class="progress-box">
                            <div class="progress-input-group">
                                <span>Ch.</span>
                                <input type="number" id="${manga.id}-progress" class="progress-input" value="${userCh}" min="0" onchange="setProgress('${manga.id}', this.value)" aria-label="Current chapter">
                            </div>
                            <div class="progress-controls">
                                <button class="step-btn outline secondary" onclick="updateProgress('${manga.id}', -1)" title="Decrease chapter">-</button>
                                <button class="step-btn" onclick="updateProgress('${manga.id}', 1)" title="Next chapter">+1</button>
                            </div>
                        </div>
                    <div class="card-links">
                        <a href="${anilistLink}" target="_blank">AniList</a>
                        <a href="${officialReadLink}" target="_blank" class="read-link">Read Official ↗</a>
                    </div>
                `;
                container.appendChild(card);
            }
            // Update the counter immediately as soon as all 143 cards are created!
            filterCards();

            // Fetch AniList data in batches of 50 (supports unlimited manga!)
            const anilistUrl = "https://" + "graphql.anilist.co";
            let mediaResults = [];

            for (let i = 0; i < uniqueMangaList.length; i += 50) {
                const batchIds = uniqueMangaList.slice(i, i + 50).map(m => m.anilistId);
                const query = `
                    query ($ids: [Int]) {
                        Page(perPage: 50) {
                            media(id_in: $ids, type: MANGA) {
                                id
                                status
                                chapters
                                genres
                                startDate { year month }
                                endDate { year month }
                            }
                        }
                    }
                `;

                const alResponse = await fetch(anilistUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query, variables: { ids: batchIds } })
                });
                const alData = await alResponse.json();
                mediaResults = mediaResults.concat(alData.data.Page.media);
            }

            // Match each AniList result back to its card and queue Jikan safely
            let delay = 0;
            for (const manga of uniqueMangaList) {
                const info = mediaResults.find(item => item.id === manga.anilistId);
                if (!info) continue;

                const statusBadge = document.getElementById(`${manga.id}-status`);

                statusBadge.innerText = info.status;
                statusBadge.className = "status-badge status-" + info.status.toLowerCase();

                const card = statusBadge.closest(".manga-card");
                card.setAttribute("data-status", info.status.toLowerCase());
                card.setAttribute("data-genres", info.genres.join(",").toLowerCase());

                // Show AniList info immediately so cards never stay on "Loading..."
                document.getElementById(`${manga.id}-latest`).innerText = formatOfficialInfo(info);

                // Queue Jikan (MyAnimeList) every 400ms to stay safely under 3 requests/sec
                setTimeout(() => {
                    checkMyAnimeList(manga.title, `${manga.id}-latest`, info);
                }, delay);
                delay += 400;
            }
            filterCards();
        }

        // 4. Fetch exact chapter & volume counts from Jikan (MyAnimeList API - No proxy needed!)
        async function checkMyAnimeList(mangaTitle, elementId, anilistBackup) {
            const cacheKey = "mal_cache_" + mangaTitle.toLowerCase();
            const cached = JSON.parse(localStorage.getItem(cacheKey));
            const oneDay = 24 * 60 * 60 * 1000;

            if (cached && (Date.now() - cached.savedAt < oneDay)) {
                if (cached.text) document.getElementById(elementId).innerText = cached.text;
                return;
            }

            try {
                const apiUrl = "https://" + `api.jikan.moe/v4/manga?q=${encodeURIComponent(mangaTitle)}&limit=1`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.data && data.data.length > 0) {
                    const mal = data.data[0];
                    const parts = [];
                    if (mal.chapters) parts.push(`Chapter ${mal.chapters}`);
                    if (mal.volumes) parts.push(`${mal.volumes} vols`);

                    if (parts.length > 0) {
                        // Combine Jikan volumes/chapters with the clean AniList date!
                        const aniText = formatOfficialInfo(anilistBackup);
                        const resultText = mal.chapters ? parts.join(" • ") : `${parts.join(" • ")} • ${aniText}`;

                        document.getElementById(elementId).innerText = resultText;
                        localStorage.setItem(cacheKey, JSON.stringify({ text: resultText, savedAt: Date.now() }));
                        return;
                    }
                }
            } catch (error) {
                // Keep the clean AniList info already shown on the card
            }
        }


        // 5. Combined live search + status/favorites filter + genre filter
        let currentFilter = "all";
        let currentGenre = "all";
        let currentSearch = "";

        function filterCards() {
            const cards = document.querySelectorAll(".manga-card");
            let visibleCount = 0;

            cards.forEach(card => {
                const id = card.getAttribute("data-id");
                const title = card.getAttribute("data-title") || "";
                const status = card.getAttribute("data-status") || "";
                const genres = card.getAttribute("data-genres") || "";

                const matchesSearch = title.includes(currentSearch);
                const matchesGenre = currentGenre.toLowerCase() === "all" || genres.toLowerCase().includes(currentGenre.toLowerCase());

                let matchesFilter = true;
                if (currentFilter === "favorites") {
                    matchesFilter = savedFavorites.includes(id);
                } else if (currentFilter === "reading") {
                    matchesFilter = (savedProgress[id] || 0) > 0;
                } else if (currentFilter !== "all") {
                    matchesFilter = status === currentFilter;
                }

                if (matchesSearch && matchesFilter && matchesGenre) {
                    card.style.display = "flex";
                    visibleCount++;
                } else {
                    card.style.display = "none";
                }
            });

            // Update the lightweight counter text
            const countElement = document.getElementById("results-count");
            if (countElement) {
                countElement.innerText = `Showing ${visibleCount} of ${cards.length} manga`;
            }
        }

        // Listen to search input, genre dropdown, and filter buttons
        document.getElementById("search-input").addEventListener("input", function (event) {
            currentSearch = event.target.value.toLowerCase();
            filterCards();
        });

        document.getElementById("genre-filter").addEventListener("change", function (event) {
            currentGenre = event.target.value;
            filterCards();
        });

        document.querySelectorAll(".filter-btn").forEach(button => {
            button.addEventListener("click", function () {
                document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
                this.classList.add("active");

                currentFilter = this.getAttribute("data-filter");
                filterCards();
            });
        });

        // Start the app!
        initTracker();
        filterCards();
    </script>
