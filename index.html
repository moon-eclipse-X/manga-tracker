<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga release tracker</title>
<link
  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="container">
        <h1>Manga Release Tracker</h1>
        <p>Track the latest chapter releases and hiatus updates for your favorite manga.</p>
    </header>

    <main class="container">
        <article>
            <h2>World Trigger</h2>
            <p>Status: <span id="wt-status">Loading...</span></p>
            <p>🇯🇵 Latest Japanese: <span id="wt-jp">Loading...</span></p>
            <p>🇬🇧 Latest English: <span id="wt-en">Loading...</span></p>
            <a href="https://anilist.co" target="_blank">View on AniList</a>
        </article>
    </main>

    <footer class="container">
        <small>Data powered by AniList & MangaDex API.</small>
    </footer>
<script>
    // 1. Unique AniList ID for World Trigger (works for ANY manga!)
    const anilistId = 78151;

    // 2. Helper function to calculate days ago from a timestamp
    function daysAgoFromTimestamp(unixTimestamp) {
        const releaseDate = new Date(unixTimestamp * 1000);
        const today = new Date();
        const difference = today - releaseDate;
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        return days === 0 ? "Today" : days + " days ago";
    }

    // 3. Fetch all manga info from AniList API
    async function getMangaData() {
        const apiUrl = "https://" + "graphql.anilist.co";
        const query = `
            query {
                Media(id: ${anilistId}, type: MANGA) {
                    status
                    chapters
                    updatedAt
                }
            }
        `;

        const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: query })
        });

        const result = await response.json();
        const manga = result.data.Media;

        // Fill your HTML spans
        document.getElementById("wt-status").innerText = manga.status;
        document.getElementById("wt-chapters").innerText = manga.chapters ? `Chapter ${manga.chapters}` : "Ongoing (unknown total)";
        document.getElementById("wt-updated").innerText = daysAgoFromTimestamp(manga.updatedAt);
    }

    // 4. Run the function
    getMangaData();
</script>
</body>
</html>
